<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">Pi5MatrixSharp</title>
  <desc id="desc">A colorful LED matrix style logo for the Pi5MatrixSharp project.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="960" height="240" rx="28" fill="url(#bg)"/>

  <g transform="translate(40 40)" filter="url(#shadow)">
    <rect width="160" height="160" rx="24" fill="#0b1220" stroke="#334155" stroke-width="3"/>
    <g transform="translate(20 20)">
      <rect x="0" y="0" width="32" height="32" rx="8" fill="#ef4444"/>
      <rect x="44" y="0" width="32" height="32" rx="8" fill="#f59e0b"/>
      <rect x="88" y="0" width="32" height="32" rx="8" fill="#22c55e"/>
      <rect x="0" y="44" width="32" height="32" rx="8" fill="#38bdf8"/>
      <rect x="44" y="44" width="32" height="32" rx="8" fill="#8b5cf6"/>
      <rect x="88" y="44" width="32" height="32" rx="8" fill="#f43f5e"/>
      <rect x="0" y="88" width="32" height="32" rx="8" fill="#14b8a6"/>
      <rect x="44" y="88" width="32" height="32" rx="8" fill="#eab308"/>
      <rect x="88" y="88" width="32" height="32" rx="8" fill="#60a5fa"/>
    </g>
    <circle cx="136" cy="24" r="8" fill="#22c55e"/>
  </g>

  <g transform="translate(240 70)">
    <text x="0" y="44" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="52" font-weight="800" fill="#f8fafc">
      Pi5MatrixSharp
    </text>
    <rect x="0" y="64" width="480" height="10" rx="5" fill="url(#accent)"/>
    <text x="0" y="118" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#cbd5e1">
      C# bindings for HUB75 RGB matrices on Raspberry Pi 5
    </text>
    <text x="0" y="156" font-family="'Avenir Next', 'Segoe UI', sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
      Powered by Adafruit Piomatter with a bundled linux-arm64 native runtime
    </text>
  </g>
</svg>
