name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore Pi5MatrixSharp.slnx

      - name: Build
        run: dotnet build Pi5MatrixSharp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Pi5MatrixSharp.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/Pi5MatrixSharp/Pi5MatrixSharp.csproj -c Release --no-build -o artifacts/nuget

      - name: Upload NuGet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
